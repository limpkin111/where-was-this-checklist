<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Was This Checklist?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink:#151515; --muted:#6b6b6b; --rule:#d9d9d9; --paper:#ffffff; --guess:#d1342f; --true:#151515; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font:15px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { display:grid; grid-template-columns: 360px 1fr; height:100vh; }
  aside { border-right:1px solid var(--ink); display:flex; flex-direction:column; min-height:0; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--ink); }
  header .top { display:flex; justify-content:space-between; align-items:baseline; font-size:12px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  header h1 { margin:6px 0 2px; font-size:20px; letter-spacing:-.01em; }
  .meta { font-size:13px; color:var(--muted); }
  .meta b { color:var(--ink); font-weight:600; }
  ol { list-style:none; margin:0; padding:4px 0; overflow:auto; flex:1; }
  li { display:flex; gap:12px; padding:3px 16px; border-bottom:1px solid #f0f0f0; }
  li .n { width:44px; text-align:right; font:13px/1.6 ui-monospace, Menlo, Consolas, monospace; color:var(--muted); flex:none; }
  li .s { flex:1; }
  footer { border-top:1px solid var(--ink); padding:12px 16px; }
  button { font:inherit; font-weight:600; width:100%; padding:11px; border:1px solid var(--ink); background:var(--ink);
    color:#fff; cursor:pointer; }
  button:disabled { background:#fff; color:var(--muted); border-color:var(--rule); cursor:default; }
  .result { font-size:14px; margin-bottom:10px; display:none; }
  .result .big { font-size:22px; font-weight:700; }
  .result a { color:var(--ink); }
  #map { height:100%; }
  .final { position:fixed; inset:0; background:rgba(255,255,255,.96); display:none; place-items:center; z-index:2000; }
  .final > div { max-width:420px; padding:24px; }
  .final h2 { margin:0 0 4px; font-size:28px; }
  .final table { width:100%; border-collapse:collapse; margin:14px 0; font-size:14px; }
  .final td { padding:5px 0; border-bottom:1px solid var(--rule); }
  .final td:last-child { text-align:right; font-family:ui-monospace, Menlo, Consolas, monospace; }
  @media (max-width: 760px) {
    .app { grid-template-columns:1fr; grid-template-rows: 50vh 50vh; height:auto; }
    aside { border-right:none; border-bottom:1px solid var(--ink); }
    #map { height:50vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <div class="top"><span id="round">Round 1 / 5</span><span id="score">0 pts</span></div>
      <h1>Where was this checklist?</h1>
      <div class="meta" id="meta"></div>
    </header>
    <ol id="list"></ol>
    <footer>
      <div class="result" id="result"></div>
      <button id="btn" disabled>Click the map to guess</button>
    </footer>
  </aside>
  <div id="map"></div>
</div>
<div class="final" id="final"><div>
  <h2 id="ftotal"></h2>
  <div class="meta">out of 25,000</div>
  <table id="ftable"></table>
  <button id="again">Play a random game</button>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="states.js"></script>
<script>
const ROUNDS = 5;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const map = L.map("map", { worldCopyJump: true, zoomSnap: 0.25 }).fitBounds([[24.5, -125], [49.5, -66.9]]);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(ESRI + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri", maxZoom: 16 }).addTo(map);
if (window.STATES) L.geoJSON(window.STATES, { style: { color: "#9a9a9a", weight: 0.8, fill: false }, interactive: false }).addTo(map);
L.tileLayer(ESRI + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }).addTo(map);

const dot = (color, r) => ({ radius: r, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 });
let game, cur, guess, layers = [];

// Daily game: same 5 checklists for everyone, keyed to the date in New York.
const PINNED = {};  // "YYYY-MM-DD": [checklist ids]
const TODAY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
function rng(seedStr) {
  let h = 2166136261;
  for (const ch of seedStr) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function pick(daily) {
  if (daily && PINNED[TODAY]) {
    const byId = Object.fromEntries(window.CHECKLISTS.map(c => [c.id, c]));
    const l = PINNED[TODAY].map(id => byId[id]).filter(Boolean);
    if (l.length === ROUNDS) return l;
  }
  const rand = daily ? rng("wwtc-" + TODAY) : Math.random;
  const pool = window.CHECKLISTS.slice().sort((a, b) => a.id < b.id ? -1 : 1), out = [], used = new Set();
  while (out.length < ROUNDS && pool.length) {
    const c = pool.splice(Math.floor(rand() * pool.length), 1)[0];
    if (used.has(c.st)) continue;            // one checklist per state per game
    used.add(c.st); out.push(c);
  }
  return out;
}
function km(a, b) {
  const R = 6371, t = x => x * Math.PI / 180;
  const dl = t(b.lat - a.lat), dn = t(b.lng - a.lng);
  const h = Math.sin(dl/2)**2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dn/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const points = d => Math.round(5000 * Math.exp(-d / 1000));
const fmtTime = h => (h % 12 || 12) + (h < 12 ? " AM" : " PM");
const fmtDur = m => m >= 60 ? `${Math.floor(m/60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`;

function start(daily) {
  game = { list: pick(daily), daily, i: 0, total: 0, log: [] };
  document.getElementById("final").style.display = "none";
  show();
}
function clearMap() { layers.forEach(l => map.removeLayer(l)); layers = []; guess = null; }
function show() {
  clearMap();
  cur = game.list[game.i];
  document.getElementById("round").textContent = `${game.daily ? "Daily · " + TODAY : "Random game"} · ${game.i + 1} / ${ROUNDS}`;
  document.getElementById("score").textContent = `${game.total.toLocaleString()} pts`;
  document.getElementById("meta").innerHTML =
    `<b>${MONTHS[cur.m - 1]}</b> · started ${fmtTime(cur.h)} · ${fmtDur(cur.dur)}` +
    (cur.n ? ` · ${cur.n} observer${cur.n > 1 ? "s" : ""}` : "") + `<br>${cur.sp.length} species`;
  document.getElementById("list").innerHTML = cur.sp.map(([s, c]) =>
    `<li><span class="n">${c == null ? "X" : c.toLocaleString()}</span><span class="s">${s}</span></li>`).join("");
  document.getElementById("list").scrollTop = 0;
  document.getElementById("result").style.display = "none";
  const b = document.getElementById("btn");
  b.textContent = "Click the map to guess"; b.disabled = true; b.onclick = submit;
  map.fitBounds([[24.5, -125], [49.5, -66.9]]);
}
map.on("click", e => {
  if (!cur || game.revealed) return;
  if (guess) map.removeLayer(guess);
  guess = L.circleMarker(e.latlng, dot("#d1342f", 8)).addTo(map);
  layers.push(guess);
  const b = document.getElementById("btn"); b.disabled = false; b.textContent = "Guess";
});
function submit() {
  const g = guess.getLatLng(), t = L.latLng(cur.lat, cur.lon), d = km(g, t), p = points(d);
  game.total += p; game.revealed = true;
  game.log.push({ st: cur.st, d, p });
  layers.push(L.polyline([g, t], { color: "#151515", weight: 1.5, dashArray: "4 4" }).addTo(map));
  layers.push(L.circleMarker(t, dot("#151515", 8)).addTo(map));
  map.fitBounds(L.latLngBounds([g, t]).pad(0.3), { maxZoom: 9 });
  const mi = Math.round(d * 0.621371);
  const r = document.getElementById("result");
  r.innerHTML = `<div class="big">${p.toLocaleString()} pts</div>` +
    `${mi.toLocaleString()} mi off · <b>${cur.hs || "Hotspot"}</b>, ${cur.st}<br>` +
    `${MONTHS[cur.m - 1]} ${cur.d}, ${cur.y} · <a href="https://ebird.org/checklist/${cur.id}" target="_blank" rel="noopener">see the checklist</a>`;
  r.style.display = "block";
  document.getElementById("score").textContent = `${game.total.toLocaleString()} pts`;
  const b = document.getElementById("btn");
  b.textContent = game.i + 1 < ROUNDS ? "Next checklist" : "See total";
  b.onclick = next;
}
function next() {
  game.revealed = false;
  if (++game.i < ROUNDS) return show();
  document.getElementById("ftotal").textContent = `${game.total.toLocaleString()} pts`;
  document.getElementById("ftable").innerHTML = game.log.map((x, i) =>
    `<tr><td>${i + 1}. ${x.st}</td><td>${Math.round(x.d * 0.621371).toLocaleString()} mi</td><td>${x.p.toLocaleString()}</td></tr>`).join("");
  document.getElementById("final").style.display = "grid";
}
document.getElementById("again").onclick = () => start(false);
start(true);
</script>
</body>
</html>
